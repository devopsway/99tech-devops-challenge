name: backend

# Pull requests: test, build and scan the image.
# Push to main: the same, then push the image to ECR (tagged with the commit
# SHA) and record it as staging's desired version in environments/. Deploying
# is deploy.yml's job.

on:
  pull_request:
    paths:
      - backend/**
      - deploy/backend/**
      - .github/workflows/backend*.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/backend/**
      - .github/workflows/backend*.yml

permissions: {}

concurrency:
  group: backend-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build, scan and push image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      LOCAL_IMAGE: backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the container
        run: |
          docker run -d --name backend -p 8080:8080 -e PORT=8080 -e APP_VERSION="$GITHUB_SHA" "$LOCAL_IMAGE"
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/healthz | grep -q "$GITHUB_SHA" && exit 0
            sleep 2
          done
          docker logs backend
          exit 1

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      # The repository uses immutable tags; skipping an existing tag keeps re-runs working.
      - name: Push image
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$IMAGE already exists"
          else
            docker tag "$LOCAL_IMAGE" "$IMAGE"
            docker push "$IMAGE"
          fi

  release:
    name: Release to staging
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-staging.yml
    with:
      app: backend
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
